# Applies the pending database migrations (supabase/migrations) to the production project. Manual only.
#
# By default it only LISTS what would be applied (dry run). Tick "apply" to really run them.
# It runs from main, through the `production` environment (so its approval rules and secrets apply):
# a migration that is not in main never reaches the database.
# Secrets: README, "Migrations from GitHub".
name: Database migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the migrations (unticked: only list what is pending)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    name: ${{ inputs.apply && 'Apply migrations' || 'Dry run' }}
    runs-on: ubuntu-latest
    environment: production
    # Two runs at once would race on the same database.
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Migrations run from main only (this run is on ${GITHUB_REF_NAME}). Choose main in 'Use workflow from'." >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Scripts on: the `supabase` package downloads its CLI binary when it installs.
      - run: npm ci
      - name: Link the project
        run: npm run db:link
      - name: Pending migrations (dry run)
        if: ${{ !inputs.apply }}
        run: npm run db:push -- --dry-run
      - name: Apply migrations
        if: ${{ inputs.apply }}
        run: npm run db:push
